[package]
name = "cyberghost-indicator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "System tray indicator to connect/disconnect CyberGhost VPN (StatusNotifierItem)"
publish = false

[dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "tokio"] }
libc = "0.2"
png = "0.18"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
